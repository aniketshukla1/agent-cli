# Agent CLI Configuration File
# Location: ./agent.toml (Workspace-local) or ~/.config/agent-cli/config.toml (Global)

[general]
# Theme options: "catppuccin_mocha", "tokyo_night", "nord", "gruvbox_dark", "cyberpunk", "monokai", "minimalist_light"
theme = "catppuccin_mocha"

# Default Model: "claude-3-7-sonnet", "claude-3-5-sonnet", "gpt-4o", "o3-mini", "gemini-2.5-pro", "llama3.3:latest"
default_model = "claude-3-7-sonnet"

# System instruction given to models
system_prompt = "You are a helpful, precise, and proactive AI assistant operating in a terminal environment. You can call tools and execute tasks thoughtfully."

# Max tokens per generation
max_tokens = 4096

# Temperature (0.0 to 1.0)
temperature = 0.7

# Enable real-time token streaming
stream = true

# Require manual interactive user confirmation before running tools
require_tool_confirmation = true

[providers]
# API keys can be set here or via environment variables (recommended):
# export ANTHROPIC_API_KEY="..."
# export OPENAI_API_KEY="..."
# export GEMINI_API_KEY="..."
# export OPENROUTER_API_KEY="..."
# anthropic_api_key = ""
# openai_api_key = ""
# openai_base_url = "https://api.openai.com/v1"
# gemini_api_key = ""
# openrouter_api_key = ""
ollama_host = "http://localhost:11434"

# Model Context Protocol (MCP) Servers
# Define Stdio-based MCP child processes here:
#
# [mcp_servers.filesystem]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "."]
#
# [mcp_servers.fetch]
# command = "uvx"
# args = ["mcp-server-fetch"]
